name: CreditIQ Production QA

on:
  push:
    branches:
      - qa/production-101-20260914

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production QA
        env:
          QA_BASE_URL: https://www.creditiq.app
        run: npm run qa:e2e
