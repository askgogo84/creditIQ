<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CreditIQ · Axis Atlas orientation check</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f0; color: #12213a; }
      main { width: min(880px, calc(100% - 40px)); }
      h1 { margin: 0 0 8px; font: 600 34px/1.1 Georgia, serif; }
      p { margin: 0 0 28px; color: #667085; }
      .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      .panel { padding: 22px; border: 1px solid #dedbd2; border-radius: 18px; background: #fff; }
      .label { margin-bottom: 16px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9b7416; }
      .frame { aspect-ratio: 1.587 / 1; display: grid; place-items: center; overflow: hidden; }
      img { width: 100%; height: 100%; object-fit: contain; }
      .corrected img { transform: rotate(-10deg) scale(.9); transform-origin: center; }
      @media (max-width: 640px) { .comparison { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Axis Atlas card orientation</h1>
      <p>The corrected card is level and aligned with every other card in CreditIQ.</p>
      <div class="comparison">
        <section class="panel">
          <div class="label">Before</div>
          <div class="frame"><img src="/card-art/axis-atlas.webp" alt="Axis Atlas before correction" /></div>
        </section>
        <section class="panel corrected">
          <div class="label">Corrected</div>
          <div class="frame"><img src="/card-art/axis-atlas.webp" alt="Axis Atlas corrected" /></div>
        </section>
      </div>
    </main>
  </body>
</html>
